name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The suite is pure Go and needs no network, so it runs the same everywhere.
jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Track the toolchain the module asks for rather than pinning a
          # version here that would quietly drift from go.mod.
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./... -timeout 10m

  cross-compile:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Every release target has to keep building, not only the host's.
      - run: ./scripts/build-release.sh ci

  nix:
    name: nix build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      # Catches a stale vendorHash, which is the one way the flake breaks
      # without anything else noticing.
      - run: nix build .#tsnail --print-build-logs
